<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小宇和交通安全小分队</title>
  <style>
    :root {
      color-scheme: light;
      --blue: #1769aa;
      --blue-dark: #123b63;
      --yellow: #ffd166;
      --green: #36b37e;
      --red: #e85d75;
      --paper: #fffdf8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(160deg, #dff4ff 0%, #fff8e7 100%);
      color: var(--blue-dark);
      font-family: "Noto Sans CJK SC", "Microsoft YaHei", system-ui, sans-serif;
    }

    .app {
      width: min(1100px, 100%);
      margin: 0 auto;
      padding: 24px 18px 36px;
    }

    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 4vw, 40px);
      letter-spacing: 0.04em;
    }

    .subtitle-note {
      margin: 6px 0 0;
      color: #4c6a82;
      font-size: 14px;
    }

    .badge {
      flex: none;
      padding: 8px 12px;
      border: 2px solid #9ed8f4;
      border-radius: 999px;
      background: #ffffffcc;
      color: var(--blue);
      font-size: 13px;
      font-weight: 700;
    }

    .stage-wrap {
      position: relative;
      overflow: hidden;
      border: 5px solid #ffffff;
      border-radius: 24px;
      background: #a9e5ff;
      box-shadow: 0 18px 40px #35647c2b;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
    }

    .scene-label {
      position: absolute;
      top: 14px;
      left: 16px;
      padding: 7px 12px;
      border-radius: 999px;
      background: #ffffffd9;
      color: var(--blue);
      font-size: 14px;
      font-weight: 800;
      box-shadow: 0 4px 10px #123b6322;
    }

    .caption {
      position: absolute;
      right: 7%;
      bottom: 5%;
      left: 7%;
      min-height: 62px;
      padding: 12px 18px;
      border: 2px solid #ffffff;
      border-radius: 16px;
      background: #102a43df;
      color: #ffffff;
      text-align: center;
      text-shadow: 0 1px 1px #0008;
      font-size: clamp(16px, 2.2vw, 24px);
      line-height: 1.45;
    }

    .caption strong {
      color: var(--yellow);
      margin-right: 8px;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 16px;
      background: #ffffffb8;
      box-shadow: 0 8px 20px #35647c18;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 9px 13px;
      background: var(--blue);
      color: white;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
    }

    button:hover,
    button:focus-visible {
      background: #0f5288;
      outline: 3px solid #ffd16699;
      outline-offset: 2px;
    }

    input[type="range"] {
      flex: 1;
      accent-color: var(--blue);
      cursor: pointer;
    }

    .time {
      min-width: 92px;
      color: #4c6a82;
      font-variant-numeric: tabular-nums;
      text-align: right;
      font-size: 14px;
    }

    .help {
      margin: 14px 2px 0;
      color: #4c6a82;
      font-size: 13px;
      line-height: 1.6;
    }

    @media (max-width: 620px) {
      header {
        display: block;
      }

      .badge {
        display: inline-block;
        margin-top: 10px;
      }

      .controls {
        flex-wrap: wrap;
      }

      input[type="range"] {
        order: 5;
        flex-basis: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div>
        <h1>《小宇和交通安全小分队》</h1>
        <p class="subtitle-note">中文二维动画原型 · 中文字幕已同步</p>
      </div>
      <div class="badge">适合6岁儿童</div>
    </header>

    <section class="stage-wrap" aria-label="动画播放区域">
      <canvas id="scene" width="960" height="540"></canvas>
      <div id="sceneLabel" class="scene-label">片头：安全小分队</div>
      <div id="caption" class="caption" aria-live="polite">
        <strong>旁白</strong>在阳光小学，有一个特别的地方，叫“交通安全小分队指挥中心”。
      </div>
    </section>

    <div class="controls" aria-label="播放控制">
      <button id="playButton" type="button">播放</button>
      <button id="restartButton" type="button">重播</button>
      <input id="progress" type="range" min="0" max="270" step="0.1" value="0" aria-label="动画进度">
      <span id="time" class="time">00:00 / 04:30</span>
    </div>

    <p class="help">
      这是依据动画片剧本制作的可播放原型。字幕为画面内同步字幕；导弹元素仅显示为预警和保护图标，不包含发射、瞄准、爆炸或攻击画面。
    </p>
  </main>

  <script>
    "use strict";

    const canvas = document.getElementById("scene");
    const ctx = canvas.getContext("2d");
    const caption = document.getElementById("caption");
    const sceneLabel = document.getElementById("sceneLabel");
    const playButton = document.getElementById("playButton");
    const restartButton = document.getElementById("restartButton");
    const progress = document.getElementById("progress");
    const timeLabel = document.getElementById("time");

    const DURATION = 270;
    let currentTime = 0;
    let playing = false;
    let lastFrame = 0;
    let animationFrame = 0;
    let lastCaptionIndex = -1;

    const subtitles = [
      { start: 0, end: 7, speaker: "旁白", text: "在阳光小学，有一个特别的地方，叫“交通安全小分队指挥中心”。", scene: "片头：安全小分队" },
      { start: 7, end: 14, speaker: "旁白", text: "这里不指挥谁去打败谁，只帮助每个小朋友安全地学习和游戏。", scene: "片头：安全小分队" },
      { start: 14, end: 20, speaker: "小宇", text: "今天的任务是：看清情况，走安全线，及时找大人！", scene: "片头：安全小分队" },
      { start: 20, end: 28, speaker: "小飞机", text: "飞机任务：从安全距离观察，不冲过去，不撞别人。", scene: "片头：安全小分队" },
      { start: 28, end: 35, speaker: "小高铁", text: "高铁任务：沿安全路线，去安全站。", scene: "片头：安全小分队" },
      { start: 35, end: 42, speaker: "预警雷达", text: "发现危险就发出警报，请可信任的大人来帮助。", scene: "片头：安全小分队" },
      { start: 42, end: 48, speaker: "大壮", text: "哎呀，我不小心碰掉你的画本了。对不起。", scene: "第一段：一次小意外" },
      { start: 48, end: 54, speaker: "豆豆", text: "没关系。我们一起捡起来吧。", scene: "第一段：一次小意外" },
      { start: 54, end: 62, speaker: "旁白", text: "一次不小心的碰撞，可以通过道歉和改正解决。", scene: "第一段：一次小意外" },
      { start: 62, end: 69, speaker: "大壮", text: "这个高铁归我了！你画得真慢，像一辆停不动的小火车！", scene: "第二段：红色预警" },
      { start: 69, end: 74, speaker: "豆豆", text: "请把高铁还给我，我还在玩。", scene: "第二段：红色预警" },
      { start: 74, end: 80, speaker: "大壮", text: "我就不还！你也不能参加我们的高铁游戏。", scene: "第二段：红色预警" },
      { start: 80, end: 87, speaker: "豆豆", text: "我不喜欢这样……我有点害怕。", scene: "第二段：红色预警" },
      { start: 87, end: 96, speaker: "预警雷达", text: "红色预警！豆豆说了“不喜欢”，东西又被拿走，安全路线也被挡住了。", scene: "第二段：红色预警" },
      { start: 96, end: 103, speaker: "小宇", text: "反复伤害、取笑、排斥别人，还让别人害怕，就不是普通的玩笑了。", scene: "第二段：红色预警" },
      { start: 103, end: 109, speaker: "豆豆", text: "大壮，我不喜欢你抢我的东西。请停止！", scene: "第三段：安全四步法" },
      { start: 109, end: 116, speaker: "小高铁", text: "第二步，走安全线！离开让你不舒服的地方，去安全站。", scene: "第三段：安全四步法" },
      { start: 116, end: 123, speaker: "小飞机", text: "第三步，报告谁做了什么、在哪里、发生了几次，以及你的感受。", scene: "第三段：安全四步法" },
      { start: 123, end: 130, speaker: "小宇", text: "第四步，陪同伴去找老师。不围观，不起哄，也不要争斗。", scene: "第三段：安全四步法" },
      { start: 130, end: 136, speaker: "全体角色", text: "说“停”！走安全线！报告大人！陪伙伴！", scene: "第三段：安全四步法" },
      { start: 136, end: 143, speaker: "豆豆", text: "大壮连续两次抢我的高铁，还挡住我。我感到害怕。", scene: "第四段：到安全站求助" },
      { start: 143, end: 150, speaker: "老师", text: "来求助不是告状，而是在保护自己和同伴。豆豆，你没有做错什么。", scene: "第四段：到安全站求助" },
      { start: 150, end: 158, speaker: "老师", text: "想参加游戏，可以先问：“我能一起玩吗？”听到“不喜欢”就必须停止。", scene: "第四段：到安全站求助" },
      { start: 158, end: 166, speaker: "大壮", text: "豆豆，对不起。我会先问，听到你说“不喜欢”就停止。", scene: "第四段：到安全站求助" },
      { start: 166, end: 174, speaker: "老师", text: "玩具要轮流，想加入要先询问，任何人害怕都可以找大人。", scene: "第四段：到安全站求助" },
      { start: 174, end: 183, speaker: "小宇", text: "真正的安全指挥员，是让每个人都安全、都被尊重。", scene: "第五段：新的友善线路" },
      { start: 183, end: 191, speaker: "小宇", text: "出发！友善高铁，开往安全校园！", scene: "第五段：新的友善线路" },
      { start: 191, end: 198, speaker: "全体角色", text: "呜——安全到站！", scene: "第五段：新的友善线路" },
      { start: 198, end: 207, speaker: "老师", text: "如果有人反复伤害、取笑、排斥，或者让你害怕，就要及时告诉大人。", scene: "片尾：安全指挥员宣言" },
      { start: 207, end: 216, speaker: "小宇", text: "遇到霸凌不是你的错。真正的勇敢，是保护自己，也安全地帮助别人。", scene: "片尾：安全指挥员宣言" },
      { start: 216, end: 228, speaker: "全体角色", text: "说“停”——走安全线——报告大人——陪伙伴！", scene: "片尾：安全指挥员宣言" },
      { start: 228, end: 240, speaker: "旁白", text: "看见友善，就一起加入；看见伤害，就及时预警、离开和求助。", scene: "片尾：安全指挥员宣言" },
      { start: 240, end: 250, speaker: "小宇", text: "小朋友，如果有人让你不舒服，你会怎么做？", scene: "片尾互动" },
      { start: 250, end: 270, speaker: "全体角色", text: "说“停”！走安全线！报告大人！陪伙伴！", scene: "片尾互动" }
    ];

    // The final cue is intentionally clipped to the 150-second prototype timeline.
    subtitles.forEach((cue) => {
      cue.start = Math.min(cue.start, DURATION);
      cue.end = Math.min(Math.max(cue.end, cue.start + 0.5), DURATION);
    });

    const sceneRanges = [
      { start: 0, end: 42, label: "片头：安全小分队" },
      { start: 42, end: 62, label: "第一段：一次小意外" },
      { start: 62, end: 103, label: "第二段：红色预警" },
      { start: 103, end: 136, label: "第三段：安全四步法" },
      { start: 136, end: 174, label: "第四段：到安全站求助" },
      { start: 174, end: 198, label: "第五段：新的友善线路" },
      { start: 198, end: 240, label: "片尾：安全指挥员宣言" },
      { start: 240, end: 270, label: "片尾互动" }
    ];

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function ease(value) {
      const x = clamp(value, 0, 1);
      return x * x * (3 - 2 * x);
    }

    function formatTime(value) {
      const seconds = Math.floor(value);
      return `${String(Math.floor(seconds / 60)).padStart(2, "0")}:${String(seconds % 60).padStart(2, "0")}`;
    }

    function roundRect(x, y, width, height, radius, fill, stroke) {
      ctx.beginPath();
      ctx.roundRect(x, y, width, height, radius);
      if (fill) {
        ctx.fillStyle = fill;
        ctx.fill();
      }
      if (stroke) {
        ctx.strokeStyle = stroke;
        ctx.stroke();
      }
    }

    function drawSky(time) {
      const gradient = ctx.createLinearGradient(0, 0, 0, 540);
      gradient.addColorStop(0, "#8ed8ff");
      gradient.addColorStop(0.7, "#e7f7df");
      gradient.addColorStop(1, "#fff3c4");
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 960, 540);

      ctx.fillStyle = "#fff6b9";
      ctx.beginPath();
      ctx.arc(820, 78, 40, 0, Math.PI * 2);
      ctx.fill();

      drawCloud(120 + Math.sin(time / 8) * 18, 88, 1);
      drawCloud(500 - Math.sin(time / 10) * 22, 115, 0.8);
      drawCloud(750 + Math.sin(time / 11) * 15, 175, 0.65);
    }

    function drawCloud(x, y, scale) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);
      ctx.fillStyle = "#ffffffd9";
      ctx.beginPath();
      ctx.arc(-32, 10, 25, 0, Math.PI * 2);
      ctx.arc(0, -4, 34, 0, Math.PI * 2);
      ctx.arc(34, 11, 23, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawCampus(time, route = false) {
      ctx.fillStyle = "#86c967";
      ctx.fillRect(0, 355, 960, 185);

      ctx.fillStyle = "#f8dc9a";
      ctx.fillRect(330, 215, 310, 180);
      ctx.fillStyle = "#f6a65b";
      ctx.beginPath();
      ctx.moveTo(305, 220);
      ctx.lineTo(485, 112);
      ctx.lineTo(665, 220);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#ffffff";
      ctx.fillRect(390, 274, 58, 53);
      ctx.fillRect(522, 274, 58, 53);
      ctx.fillStyle = "#1769aa";
      ctx.font = "bold 18px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("阳光小学", 485, 250);

      ctx.fillStyle = "#d5b26b";
      ctx.fillRect(0, 402, 960, 72);
      ctx.fillStyle = "#f9f1c8";
      for (let x = -80; x < 1000; x += 120) {
        ctx.fillRect(x, 433, 65, 8);
      }

      drawTree(95, 330, 1.1);
      drawTree(770, 332, 0.9);
      drawTree(875, 350, 0.75);

      if (route) {
        ctx.save();
        ctx.setLineDash([18, 12]);
        ctx.lineWidth = 8;
        ctx.strokeStyle = "#ffe066";
        ctx.beginPath();
        ctx.moveTo(90, 386);
        ctx.bezierCurveTo(250, 385, 275, 470, 470, 450);
        ctx.bezierCurveTo(635, 434, 662, 365, 820, 388);
        ctx.stroke();
        ctx.restore();
        roundRect(715, 342, 150, 46, 12, "#ffffffed", "#36b37e");
        ctx.fillStyle = "#19704e";
        ctx.font = "bold 19px sans-serif";
        ctx.fillText("安全站：老师身边", 790, 371);
      }
    }

    function drawTree(x, y, scale) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);
      ctx.fillStyle = "#8a5a36";
      ctx.fillRect(-10, 24, 20, 70);
      ctx.fillStyle = "#2f9e61";
      ctx.beginPath();
      ctx.arc(0, 5, 42, 0, Math.PI * 2);
      ctx.arc(-28, 25, 30, 0, Math.PI * 2);
      ctx.arc(30, 27, 29, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawControlCenter() {
      roundRect(42, 242, 226, 123, 18, "#fffdf8e8", "#1769aa");
      ctx.fillStyle = "#1769aa";
      ctx.font = "bold 22px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("交通安全", 155, 278);
      ctx.fillText("小分队指挥中心", 155, 308);
      ctx.fillStyle = "#fff0a6";
      ctx.beginPath();
      ctx.arc(94, 336, 13, 0, Math.PI * 2);
      ctx.arc(134, 336, 13, 0, Math.PI * 2);
      ctx.arc(174, 336, 13, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawPlane(x, y, scale, tilt = 0) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(tilt);
      ctx.scale(scale, scale);
      ctx.fillStyle = "#ffffff";
      ctx.strokeStyle = "#1769aa";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(-64, 5);
      ctx.lineTo(54, -8);
      ctx.lineTo(20, 8);
      ctx.lineTo(64, 22);
      ctx.lineTo(10, 20);
      ctx.lineTo(-24, 53);
      ctx.lineTo(-18, 17);
      ctx.lineTo(-64, 5);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = "#ff7c72";
      ctx.beginPath();
      ctx.arc(15, 7, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawTrain(x, y, scale, moving = false) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);
      roundRect(-112, -43, 220, 75, 18, "#eaf6ff", "#1769aa");
      ctx.fillStyle = "#ff7c72";
      ctx.fillRect(-112, -43, 220, 13);
      ctx.fillStyle = "#72c7ee";
      for (let i = -76; i <= 60; i += 45) {
        roundRect(i, -18, 28, 23, 5, "#bceaff");
      }
      ctx.fillStyle = "#f5c453";
      ctx.beginPath();
      ctx.arc(-77, 34, 14, 0, Math.PI * 2);
      ctx.arc(70, 34, 14, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#1769aa";
      ctx.font = "bold 20px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("安全高铁", 0, 20);
      if (moving) {
        ctx.strokeStyle = "#ffffffaa";
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(-145, -10);
        ctx.lineTo(-180, -10);
        ctx.moveTo(-145, 17);
        ctx.lineTo(-195, 17);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawRadar(x, y, alert = false) {
      ctx.save();
      ctx.translate(x, y);
      ctx.fillStyle = alert ? "#ffe0e7" : "#e4faef";
      ctx.strokeStyle = alert ? "#e85d75" : "#36b37e";
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.arc(0, 0, 53, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.strokeStyle = alert ? "#e85d75" : "#36b37e";
      ctx.lineWidth = 7;
      ctx.beginPath();
      ctx.arc(0, 0, 27, Math.PI, 0);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(34, -28);
      ctx.stroke();
      ctx.fillStyle = alert ? "#e85d75" : "#36b37e";
      ctx.beginPath();
      ctx.arc(0, 0, 7, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = alert ? "#b4233b" : "#19704e";
      ctx.font = "bold 15px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(alert ? "安全预警" : "预警雷达", 0, 77);
      ctx.restore();
    }

    function drawKid(x, y, color, name, worried = false, wave = false) {
      ctx.save();
      ctx.translate(x, y);
      ctx.strokeStyle = "#123b63";
      ctx.lineWidth = 4;
      ctx.lineCap = "round";

      ctx.fillStyle = "#f5c6a5";
      ctx.beginPath();
      ctx.arc(0, -64, 28, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(0, -76, 29, Math.PI, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "#123b63";
      ctx.beginPath();
      ctx.arc(-9, -65, 3.5, 0, Math.PI * 2);
      ctx.arc(9, -65, 3.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      if (worried) {
        ctx.arc(0, -53, 9, Math.PI + 0.35, Math.PI * 2 - 0.35);
      } else {
        ctx.arc(0, -57, 9, 0.25, Math.PI - 0.25);
      }
      ctx.stroke();

      ctx.fillStyle = color;
      roundRect(-25, -34, 50, 72, 14, color, "#123b63");
      ctx.beginPath();
      ctx.moveTo(-20, -15);
      ctx.lineTo(-51, wave ? -55 : 3);
      ctx.moveTo(20, -15);
      ctx.lineTo(51, wave ? -48 : 3);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-12, 38);
      ctx.lineTo(-18, 78);
      ctx.moveTo(12, 38);
      ctx.lineTo(18, 78);
      ctx.stroke();

      ctx.fillStyle = "#123b63";
      ctx.font = "bold 16px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(name, 0, 106);
      ctx.restore();
    }

    function drawSpeech(text, x, y, width = 260) {
      roundRect(x, y, width, 54, 14, "#ffffffed", "#1769aa");
      ctx.fillStyle = "#123b63";
      ctx.font = "bold 17px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(text, x + width / 2, y + 33);
    }

    function drawFourSteps(time) {
      const steps = [
        ["1", "说“停”", "#ffcf56"],
        ["2", "走安全线", "#72c7ee"],
        ["3", "报告大人", "#8fcea5"],
        ["4", "陪伙伴", "#ff9b85"]
      ];
      steps.forEach((step, index) => {
        const x = 115 + index * 195;
        const active = Math.floor((time - 103) / 7) === index;
        roundRect(x, 176, 165, 108, 20, active ? "#ffffff" : "#ffffffc9", active ? "#1769aa" : "#ffffff");
        ctx.fillStyle = step[2];
        ctx.beginPath();
        ctx.arc(x + 34, 210, 21, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#123b63";
        ctx.font = "bold 20px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(step[0], x + 34, 217);
        ctx.font = "bold 18px sans-serif";
        ctx.fillText(step[1], x + 95, 218);
      });
      ctx.fillStyle = "#1769aa";
      ctx.font = "bold 24px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("安全交通四步法", 480, 135);
    }

    function drawScene(time) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawSky(time);

      if (time < 42) {
        drawCampus(time, false);
        drawControlCenter();
        drawPlane(490 + Math.sin(time / 2) * 130, 105 + Math.sin(time) * 12, 0.7, -0.08);
        drawTrain(700 + Math.sin(time / 2.5) * 15, 365, 0.55, true);
        drawRadar(185, 180, false);
        drawKid(450, 395, "#f5a65b", "小宇", false, true);
        if (time > 20) {
          drawSpeech("看清情况，走安全线！", 330, 300, 280);
        }
        return;
      }

      if (time < 62) {
        drawCampus(time, false);
        drawKid(400, 400, "#f5a65b", "小宇");
        drawKid(560, 400, "#8fcea5", "豆豆");
        drawKid(700, 400, "#ff9b85", "大壮");
        drawPlane(515, 260, 0.45, -0.12);
        if (time < 54) {
          drawSpeech("对不起，我不小心的。", 610, 240, 250);
        } else {
          drawSpeech("没关系，一起捡起来吧。", 330, 240, 250);
        }
        return;
      }

      if (time < 103) {
        drawCampus(time, true);
        drawKid(385, 400, "#f5a65b", "小宇");
        drawKid(555, 400, "#8fcea5", "豆豆", time > 78);
        drawKid(700, 400, "#ff9b85", "大壮", false, time < 78);
        drawTrain(540, 340, 0.38, false);
        drawRadar(835, 210, time > 78);
        if (time > 78) {
          roundRect(650, 125, 230, 62, 16, "#ffe0e7", "#e85d75");
          ctx.fillStyle = "#b4233b";
          ctx.font = "bold 22px sans-serif";
          ctx.textAlign = "center";
          ctx.fillText("红色预警：需要帮助", 765, 164);
        }
        return;
      }

      if (time < 136) {
        drawCampus(time, true);
        drawFourSteps(time);
        drawPlane(775, 100 + Math.sin(time) * 8, 0.45, -0.08);
        drawTrain(160 + ((time - 103) * 6), 405, 0.28, true);
        drawRadar(835, 210, true);
        return;
      }

      if (time < 174) {
        drawCampus(time, true);
        drawRadar(835, 210, false);
        drawKid(430, 400, "#f5a65b", "小宇");
        drawKid(570, 400, "#8fcea5", "豆豆", false);
        drawKid(730, 400, "#ff9b85", "大壮", false);
        drawKid(700, 285, "#6d9ee8", "老师", false, true);
        drawTrain(555, 342, 0.34, false);
        if (time > 143 && time < 158) {
          drawSpeech("你没有做错什么。", 300, 225, 250);
        } else if (time >= 158) {
          drawSpeech("对不起，我会先问。", 600, 225, 250);
        }
        return;
      }

      if (time < 198) {
        drawCampus(time, true);
        drawKid(385, 400, "#f5a65b", "小宇", false, true);
        drawKid(555, 400, "#8fcea5", "豆豆", false, true);
        drawKid(700, 400, "#ff9b85", "大壮", false, true);
        drawTrain(600 + Math.sin(time) * 12, 335, 0.35, true);
        ctx.fillStyle = "#19704e";
        ctx.font = "bold 26px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("友善高铁，开往安全校园！", 480, 120);
        return;
      }

      drawCampus(time, true);
      drawRadar(835, 210, false);
      drawPlane(530 + Math.sin(time / 2) * 100, 115, 0.58, -0.08);
      drawTrain(640, 350, 0.42, true);
      drawKid(355, 405, "#f5a65b", "小宇", false, true);
      drawKid(480, 405, "#8fcea5", "豆豆", false, true);
      drawKid(605, 405, "#ff9b85", "大壮", false, true);
      roundRect(260, 105, 440, 92, 22, "#ffffffdd", "#36b37e");
      ctx.fillStyle = "#1769aa";
      ctx.font = "bold 28px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("安全校园，从我做起！", 480, 145);
      ctx.font = "bold 22px sans-serif";
      ctx.fillText("说停 · 走安全线 · 报告大人 · 陪伙伴", 480, 178);
    }

    function updateCaption(time) {
      let index = subtitles.findIndex((cue) => time >= cue.start && time < cue.end);
      if (index < 0 && time >= 130) {
        index = subtitles.length - 1;
      }
      if (index !== lastCaptionIndex && index >= 0) {
        const cue = subtitles[index];
        caption.innerHTML = `<strong>${cue.speaker}</strong>${cue.text}`;
        sceneLabel.textContent = cue.scene;
        lastCaptionIndex = index;
      }
    }

    function updateControls() {
      progress.value = currentTime.toFixed(1);
      timeLabel.textContent = `${formatTime(currentTime)} / ${formatTime(DURATION)}`;
      playButton.textContent = playing ? "暂停" : "播放";
    }

    function render(timeStamp) {
      if (!lastFrame) {
        lastFrame = timeStamp;
      }
      const delta = (timeStamp - lastFrame) / 1000;
      lastFrame = timeStamp;
      if (playing) {
        currentTime += delta;
        if (currentTime >= DURATION) {
          currentTime = DURATION;
          playing = false;
        }
      }
      drawScene(currentTime);
      updateCaption(currentTime);
      updateControls();
      animationFrame = requestAnimationFrame(render);
    }

    playButton.addEventListener("click", () => {
      if (currentTime >= DURATION) {
        currentTime = 0;
        lastCaptionIndex = -1;
      }
      playing = !playing;
      lastFrame = 0;
    });

    restartButton.addEventListener("click", () => {
      currentTime = 0;
      playing = true;
      lastCaptionIndex = -1;
      lastFrame = 0;
    });

    progress.addEventListener("input", () => {
      currentTime = Number(progress.value);
      lastCaptionIndex = -1;
      drawScene(currentTime);
      updateCaption(currentTime);
      updateControls();
    });

    drawScene(0);
    updateCaption(0);
    updateControls();
    animationFrame = requestAnimationFrame(render);
  </script>
</body>
</html>
