<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>三、二、一，改航</title>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="film.css">
</head>
<body>
  <header>
    <h1>三、二、一，改航</h1>
    <p>带字幕的中文卡通 · 约十分钟</p>
  </header>
  <div id="frame">
    <div id="stage" data-scene="sky" data-imagine="0" data-missile="hide" data-bubbles="0" data-lights="">
      <div class="bg sky" aria-hidden="true">
        <i class="cloud c1"></i>
        <i class="cloud c2"></i>
        <i class="cloud c3"></i>
      </div>
      <div class="bg class" aria-hidden="true">
        <div class="window"></div>
        <div class="sign">三盏灯</div>
        <div class="floor"></div>
        <div class="desk d1"></div>
        <div class="desk d2"></div>
        <div class="desk d3"></div>
      </div>
      <div class="bg hall" aria-hidden="true">
        <div class="rail"></div>
      </div>
      <div class="bg yard" aria-hidden="true">
        <div class="sun"></div>
        <svg class="queue" viewBox="0 0 960 540">
          <path d="M40 430 C 180 390, 320 450, 520 410 S 820 390, 930 360" fill="none" stroke="#fff" stroke-width="16"/>
          <path d="M40 430 C 180 390, 320 450, 520 410 S 820 390, 930 360" fill="none" stroke="#f4c430" stroke-width="6" stroke-dasharray="14 12"/>
        </svg>
      </div>
      <div class="bg map" aria-hidden="true">
        <svg class="mapsvg" viewBox="0 0 960 540">
          <path d="M70 400 C 220 300, 380 460, 560 340 S 820 250, 910 220" fill="none" stroke="#fff" stroke-width="22"/>
          <path d="M70 400 C 220 300, 380 460, 560 340 S 820 250, 910 220" fill="none" stroke="#e7a317" stroke-width="8" stroke-dasharray="16 12"/>
        </svg>
        <div class="endcard">下一站，朋友站</div>
      </div>

      <div id="lamps" aria-hidden="true"><i></i><i></i><i></i></div>
      <div id="screen"></div>
      <div id="accident">意外</div>

      <div id="silo" aria-hidden="true">
        <div id="count"></div>
        <div id="lid"></div>
        <div id="well"><div id="rocket"></div></div>
        <div id="btn-go">发射</div>
        <div id="btn-stop">中止</div>
      </div>
      <div id="flare" aria-hidden="true"></div>
      <div id="smoke">找老师</div>

      <div id="bubbles" aria-hidden="true">
        <i class="bubble"></i><i class="bubble"></i><i class="bubble"></i><i class="bubble"></i><i class="bubble"></i>
      </div>
      <div id="horn">喇叭</div>
      <div id="plane" class="prop"></div>
      <div id="train" class="prop"><span>咚咚号</span><b></b><b></b><b></b></div>
      <div id="ball" class="prop"></div>
      <i class="star"></i><i class="star"></i><i class="star"></i>
      <div id="cast"></div>
      <div id="crayon"><span>想象</span></div>
      <div id="tag"></div>
      <div id="subtitle">
        <b id="who"></b>
        <span id="line"></span>
      </div>
    </div>
  </div>
  <div id="controls">
    <button id="play" type="button">暂停</button>
    <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="进度">
    <span id="clock">0:00 / 0:00</span>
    <div id="chapters">
      <button type="button" data-ch="0">序幕</button>
      <button type="button" data-ch="1">第一关</button>
      <button type="button" data-ch="2">第二关</button>
      <button type="button" data-ch="3">第三关</button>
      <button type="button" data-ch="4">第四关</button>
      <button type="button" data-ch="5">第五关</button>
    </div>
  </div>
  <script src="film.js"></script>
</body>
</html>
